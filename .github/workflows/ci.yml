name: CI

on:
  push:
    branches: [stable, dev]
    tags: ['v*']
  pull_request:
    branches: [stable, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tooling
        run: pip install ruff mypy

      - name: Ruff
        run: ruff check draupnir tests

      - name: Ruff format check
        run: ruff format --check draupnir tests
        continue-on-error: true

      - name: Mypy
        run: mypy draupnir
        continue-on-error: true

  test:
    name: Test (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Show git version
        run: git --version

      - name: Test
        run: pytest tests -q --cov=draupnir --cov-report=term-missing

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check dist/*

      - name: Smoke test the wheel
        run: |
          pip install dist/*.whl
          draupnir --version
          draupnir --help

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
